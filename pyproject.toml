[project]
name = "mabel"
version = "2.0.0"
description = "Mabel answers the phone when a contractor can't."
requires-python = ">=3.12"
dependencies = [
  "mabel-domain",
  "mabel-verticals",
  "mabel-db",
  "mabel-xai",
  "mabel-mcp",
  "mabel-media",
  "mabel-sms",
  "mabel-telnyx",
  "mabel-worker",
  "mabel-api",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "pyright>=1.1.380",
]

[tool.uv.workspace]
members = ["packages/*", "apps/api", "apps/media", "apps/worker"]

[tool.uv.sources]
mabel-domain = { workspace = true }
mabel-verticals = { workspace = true }
mabel-db = { workspace = true }
mabel-xai = { workspace = true }
mabel-mcp = { workspace = true }
mabel-media = { workspace = true }
mabel-sms = { workspace = true }
mabel-telnyx = { workspace = true }
mabel-worker = { workspace = true }
mabel-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["packages", "apps/api", "apps/media", "apps/worker", "tests"]
exclude = ["**/node_modules", "**/__pycache__", "apps/api/src/mabel"]

[tool.ruff.lint.isort]
known-first-party = [
  "mabel_domain", "mabel_verticals", "mabel_db", "mabel_xai", "mabel_telnyx",
  "mabel_mcp", "mabel_sms", "mabel_integrations",
  "mabel_api", "mabel_media", "mabel_worker",
]
