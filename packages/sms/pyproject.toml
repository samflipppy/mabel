[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mabel-sms"
version = "2.0.0"
description = "The owner's SMS interface: command grammar, recall, and message composition."
requires-python = ">=3.12"
dependencies = ["mabel-domain"]

[tool.setuptools.packages.find]
include = ["mabel_sms*"]
