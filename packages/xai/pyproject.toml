[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mabel-xai"
version = "2.0.0"
description = "Every assumption Mabel makes about the xAI API, in one place."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["mabel_xai*"]
