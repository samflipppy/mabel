[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mabel-verticals"
version = "2.0.0"
description = "Mabel trade rulesets and the emergency engine. Pure: no I/O, no DB, no network."
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
# The rulesets and fixtures sit beside the package rather than inside it, as
# 04-REPO.md lays out. They are bundled as data so an installed wheel can still
# load them.
packages = ["mabel_verticals"]

[tool.setuptools.package-data]
mabel_verticals = ["../rulesets/*.json", "../fixtures/*.json"]
