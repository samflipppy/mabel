[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mabel-integrations"
version = "2.0.0"
description = "Google Calendar, Jobber, Housecall Pro, and outbound webhooks."
requires-python = ">=3.12"
dependencies = ["mabel-domain", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["mabel_integrations*"]
