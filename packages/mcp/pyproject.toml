[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mabel-mcp"
version = "2.0.0"
description = "Mabel's MCP server. Nine tools, Streamable HTTP, tenant from the token."
requires-python = ">=3.12"
dependencies = [
  "mabel-domain",
  "mabel-db",
  "mabel-verticals",
  "pyjwt>=2.9",
  "fastapi>=0.115",
]

[tool.setuptools.packages.find]
include = ["mabel_mcp*"]
