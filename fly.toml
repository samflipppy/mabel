# Mabel API. Names only. Sam sets secrets. A bot does not fly deploy.

app = "mabel"
primary_region = "iad"

[build]
  dockerfile = "apps/api/Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

# Fly secrets Sam sets (names only, no values):
# DATABASE_URL
# MABEL_ADMIN_TOKEN
# MABEL_MCP_TOKEN_SECRET
# MABEL_MCP_PUBLIC_URL
# XAI_API_KEY
# XAI_WEBHOOK_SECRET
# TELNYX_API_KEY
# TELNYX_FROM_E164
