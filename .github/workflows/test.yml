name: test

# Manual only, at Sam's request 2026-08-29. See the note in ci.yml.
#
# This is the v1 workflow. It installs packages/verticals and apps/api the old
# way, and both have been restructured since -- it would fail now for reasons
# that have nothing to do with the code being wrong. Superseded by ci.yml;
# delete it once ci.yml has gone green at least once.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/verticals/pyproject.toml
            apps/api/pyproject.toml

      - name: Install packages/verticals then apps/api[dev]
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/verticals
          python -m pip install -e "apps/api[dev]"

      - name: pytest packages/verticals
        working-directory: packages/verticals
        run: python -m pytest

      - name: pytest apps/api
        working-directory: apps/api
        run: python -m pytest

      - name: ruff apps/api
        working-directory: apps/api
        run: python -m ruff check src tests
