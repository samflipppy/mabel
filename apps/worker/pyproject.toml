[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mabel-worker"
version = "2.0.0"
description = "The Postgres SKIP LOCKED queue runner."
requires-python = ">=3.12"
dependencies = [
  "mabel-domain",
  "mabel-db",
  "mabel-sms",
  "mabel-telnyx",
  "mabel-verticals",
  "mabel-billing",
  "mabel-integrations",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mabel_worker*"]

[tool.setuptools.package-dir]
"" = "src"
